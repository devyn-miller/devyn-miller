<svg xmlns="http://www.w3.org/2000/svg" width="340" height="48">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5EA"/>
      <stop offset="50%" style="stop-color:#6870F3"/>
      <stop offset="100%" style="stop-color:#C261E3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="340" height="48" rx="10" fill="#1A2533"/>
  <rect x="1" y="1" width="338" height="46" rx="9" fill="none" stroke="url(#textGrad)" stroke-opacity="0.3" stroke-width="1"/>
  <text x="170" y="31" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">😎 My Portfolio Website!</text>
</svg>
